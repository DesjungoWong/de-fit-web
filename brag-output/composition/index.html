<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-atrium","type":"color","label":"Atrium ground","default":"#1E1230"},
    {"id":"color-lilac","type":"color","label":"Atrium accent","default":"#C08BFF"},
    {"id":"color-aisle","type":"color","label":"AISLE ground","default":"#0B1724"},
    {"id":"color-aqua","type":"color","label":"AISLE accent","default":"#45D6C2"},
    {"id":"color-paper","type":"color","label":"Catalogue ground","default":"#F3F1F7"},
    {"id":"color-ink","type":"color","label":"Catalogue ink","default":"#18142A"},
    {"id":"color-violet","type":"color","label":"Catalogue accent","default":"#6E43D9"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-atrium: #1e1230;
        --color-lilac: #c08bff;
        --color-aisle: #0b1724;
        --color-aqua: #45d6c2;
        --color-paper: #f3f1f7;
        --color-ink: #18142a;
        --color-violet: #6e43d9;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-atrium);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-atrium);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22.6"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div
        id="atrium"
        data-composition-id="atrium"
        data-composition-src="compositions/atrium.html"
        data-start="0"
        data-duration="9.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="aisle"
        data-composition-id="aisle"
        data-composition-src="compositions/aisle.html"
        data-start="9.4"
        data-duration="6.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"

      <div

        data-start="19.4"
        data-duration="3.2"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <!-- Narration (Kokoro af_heart), one line per scene -->

      <audio id="vo4" class="clip" data-start="15.8" data-duration="2.45" data-track-index="5" data-volume="1" src="assets/vo/vo4.wav"></audio>

      <!-- Music bed: ducked under each narration line, swells for the outro, fades out -->
      <audio
        id="bg-music"
        class="clip"
        data-start="0"
        data-duration="22.6"
        data-track-index="10"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.45,"v":0.14},{"t":2.9,"v":0.14},{"t":3.15,"v":0.26},{"t":3.35,"v":0.14},{"t":9.55,"v":0.14},{"t":9.8,"v":0.28},{"t":9.98,"v":0.14},{"t":15.35,"v":0.14},{"t":15.6,"v":0.28},{"t":15.78,"v":0.14},{"t":18.3,"v":0.14},{"t":18.9,"v":0.32},{"t":21.1,"v":0.32},{"t":22.6,"v":0}]}]}'

    <script>
